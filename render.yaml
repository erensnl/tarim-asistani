services:
  - type: web
    name: tarim-asistani-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLANTNET_API_KEY
        sync: false
      - key: PLANTNET_PROJECT
        value: all
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: meta/llama-3.2-90b-vision-instruct
